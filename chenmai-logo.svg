<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <defs>
    <!-- 深夜蓝渐变背景 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0f1f3d"/>
    </linearGradient>
    <!-- 雷达圆环渐变 -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <!-- 脉冲波渐变 -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <!-- 扫描线渐变 -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
    <!-- 光晕滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 圆形裁剪 -->
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="82"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="200" rx="16" fill="url(#bg)"/>

  <!-- ───── 左侧：雷达图标 ───── -->
  <!-- 雷达辉光底 -->
  <circle cx="100" cy="100" r="82" fill="url(#radarGlow)"/>

  <!-- 雷达同心圆 -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.2"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#00d4ff" stroke-width="0.6" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="42" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="100" cy="100" r="26" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- 雷达十字线 -->
  <line x1="100" y1="22" x2="100" y2="178" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="22" y1="100" x2="178" y2="100" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- 雷达扇形扫描区（已扫描区域浅蓝色扇面） -->
  <path d="M100,100 L100,25 A75,75 0 0,1 163,137 Z"
        fill="#00d4ff" fill-opacity="0.05"
        clip-path="url(#circleClip)"/>

  <!-- 扫描线（亮边） -->
  <line x1="100" y1="100" x2="163" y2="137"
        stroke="url(#scanGrad)" stroke-width="1.5" filter="url(#glow)"
        stroke-opacity="0.9"/>
  <!-- 扫描线起点点 -->
  <line x1="100" y1="100" x2="100" y2="26"
        stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>

  <!-- 脉冲心跳波（穿越雷达中央） -->
  <polyline
    points="22,100 45,100 55,100 62,78 68,122 75,68 82,132 88,94 95,108 100,100 107,100 113,100 120,88 126,112 133,100 155,100 178,100"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    clip-path="url(#circleClip)"/>

  <!-- 中心点 -->
  <circle cx="100" cy="100" r="4" fill="#00d4ff" filter="url(#softGlow)" fill-opacity="0.9"/>
  <circle cx="100" cy="100" r="2" fill="white"/>

  <!-- 雷达回波点（扫描到的目标） -->
  <circle cx="133" cy="68" r="2.5" fill="#f59e0b" filter="url(#glow)" fill-opacity="0.9"/>
  <circle cx="148" cy="115" r="2" fill="#00d4ff" filter="url(#glow)" fill-opacity="0.8"/>
  <circle cx="70" cy="130" r="1.8" fill="#7c3aed" filter="url(#glow)" fill-opacity="0.9"/>

  <!-- 外圈边框 -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5"/>

  <!-- ───── 右侧：文字 ───── -->

  <!-- 晨脉 主标题 -->
  <text x="208" y="90"
        font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="4"
        fill="white"
        filter="url(#glow)">晨脉</text>

  <!-- 分割线 -->
  <line x1="208" y1="102" x2="432" y2="102"
        stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- AI×RADAR 副标题 -->
  <text x="210" y="128"
        font-family="'SF Pro Display','Helvetica Neue','Arial',sans-serif"
        font-size="18"
        font-weight="300"
        letter-spacing="6"
        fill="#00d4ff"
        fill-opacity="0.9">AI×RADAR</text>

  <!-- 标语 -->
  <text x="211" y="155"
        font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="11"
        font-weight="400"
        letter-spacing="2"
        fill="white"
        fill-opacity="0.4">AI &amp; 时尚行业每日情报</text>

  <!-- 右下角装饰点 -->
  <circle cx="430" cy="170" r="1.5" fill="#f59e0b" fill-opacity="0.6"/>
  <circle cx="438" cy="170" r="1.5" fill="#00d4ff" fill-opacity="0.6"/>
  <circle cx="446" cy="170" r="1.5" fill="#7c3aed" fill-opacity="0.6"/>
</svg>
